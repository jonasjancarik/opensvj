<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)" />
    <script>
      // Uložený vzhled nastavit před prvním vykreslením, aby stránka neproblikla.
      try {
        const v = localStorage.getItem('vzhled')
        if (v === 'svetly' || v === 'tmavy') document.documentElement.dataset.vzhled = v
      } catch {}
    </script>
    <title>OpenSVJ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
