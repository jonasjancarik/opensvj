  - {oznaceni: "1001/12", plocha: "33.50", podil: "335/8600"}

# Variabilní symbol plateb vlastníků: 1001 + číslo jednotky (3 číslice) + pořadí vlastníka
# (2 číslice), např. 100100601 pro 1001/6.
vs_predpona: "1001"

# Služby podle zákona 67/2013. Klíč pro roční vyúčtování: osoby (osobo-měsíce podle předpisu,
# výchozí podle § 5 odst. 2), jednotka (rovným dílem), plocha, podil, meridla (spotřeba
# z odečtů; druh měřidla v `meridlo`), nebo zuctovatel (výsledky po jednotkách od zúčtovatele
# tepla a teplé vody).
sluzby:
  ELEKTRINA: {analytika: "002", nazev: Elektřina, klic: osoby}
  ELEKTRINA_VYTAH: {analytika: "003", nazev: Elektřina výtah, klic: osoby}
  OHREV_TUV: {analytika: "004", nazev: Náklady na ohřev, klic: zuctovatel}
  ROZUCTOVANI: {analytika: "005", nazev: Náklady na rozúčtování, klic: jednotka}
  TEPLO: {analytika: "006", nazev: Náklady na teplo, klic: zuctovatel}
  ODPAD: {analytika: "007", nazev: Odpad, klic: osoby}
  SV_TUV: {analytika: "011", nazev: SV pro TV, klic: zuctovatel}
  UKLID: {analytika: "012", nazev: Úklid, klic: osoby}
  VODA: {analytika: "013", nazev: Vodné a stočné, klic: meridla, meridlo: studena_voda}
  VYTAH: {analytika: "014", nazev: Výtah, klic: osoby}

# Krátkodobé zálohy na správu domu. Nejsou to služby podle § 2 zákona 67/2013, takže do
# vyúčtování služeb nepatří; vyúčtují se jako správa. Klíč pro roční vyúčtování: podíl na
# společných částech, nebo rovným dílem na jednotku u odměny správce a vlastní správní
# činnosti (§ 1180 odst. 2 OZ).
sprava:
  DROBNE_OPRAVY: {analytika: "001", nazev: Drobné opravy, klic: podil}
  OSTATNI: {analytika: "008", nazev: Ostatní náklady (revize), klic: podil}
  POJISTENI: {analytika: "009", nazev: Pojištění domu, klic: podil}
  SPRAVA: {analytika: "010", nazev: Správa nemovitosti, klic: jednotka}

