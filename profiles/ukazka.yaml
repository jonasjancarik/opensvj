# Ukázkové fiktivní SVJ pro testy a vyzkoušení aplikace. Jména, čísla i částky jsou
# vymyšlené; žádné skutečné SVJ to není.
#
# Role s hvězdičkou platí pro všechny služby: účet = syntetický účet + analytika služby.
# Konkrétní role (bez hvězdičky) má přednost před hvězdičkou.

id: ukazka
nazev: Společenství vlastníků Ukázková 12
ico: "12345678"
sidlo: Ukázková 1001/12, 120 00 Praha 2
statutarni_organ: výbor společenství (3 členové)
prispevky: zalohove
# Kdo platí předpis za měsíc převodu jednotky: dosavadni (vlastník k 1. dni měsíce) nebo novy.
predpis_mesice_prevodu: dosavadni
# Komu jde roční vyúčtování jednotky, která během roku změnila vlastníka: soucasnemu
# (celé vlastníkovi k 31. 12.) nebo po_obdobich (každému vlastníkovi za jeho měsíce).
vyuctovani_pri_prevodu: soucasnemu

# Jednotky: označení (číslo popisné/číslo jednotky), podlahová plocha v m² a podíl na
# společných částech (tady podle plochy, jmenovatel 8600).
jednotky:
