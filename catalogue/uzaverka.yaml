# Uzávěrka, otevření roku a opravy. Formát viz README.md v této složce.
# Uzavírací operace pracují se zůstatky všech účtů, proto je provádí kód (zpusob: kod), ne šablona.

- id: uzavreni-vysledkovych
  nazev: Uzavření nákladů a výnosů
  kdy: 31. 12. po všech ostatních zápisech roku a kontrolách uzávěrky.
  stav: navrh
  doklad: UZ
  zpusob: kod
  postup:
    - Každý zůstatek třídy 5 proti `ucet_vysledku` (MD ucet_vysledku / D náklad).
    - Každý zůstatek třídy 6 proti `ucet_vysledku` (MD výnos / D ucet_vysledku).
    - Zůstatek `ucet_vysledku` je výsledek roku. U SVJ bývá nulový; nenulový (třeba zdaněné úroky) se uzavře na `konecny_rozvazny` a v dalším roce otevře na `vysledek_ve_schvalovani`.
    - Jde jen tehdy, když uzávěrka nehlásí nic chybějícího a ruční body jsou odškrtnuté.
  zdroje:
    - {typ: vyhlaska, odkaz: "vyhláška 504/2002, příloha 3, skupiny 93 a 96"}
  platnost: {od: 2014-01-01}
  priklady: []

- id: uzavreni-rozvahovych
  nazev: Uzavření rozvahových účtů a otevření dalšího roku
  kdy: Po `uzavreni-vysledkovych`; otevření k 1. 1. dalšího roku.
  stav: navrh
  doklad: UZ
  zpusob: kod
  postup:
    - Každý rozvahový zůstatek včetně dimenzí (jednotka, služba, faktura, dřívější vlastník) proti `konecny_rozvazny`.
    - Dluhy současných vlastníků po položkách se splatností; platby se započítávají jen v rámci účtu, aby počáteční stav každého účtu navazoval.
    - Zrcadlově proti `pocatecni_rozvazny` k 1. 1. jako `otevreni-pocatecnimi-stavy`; součet otevření přesně odpovídá uzavření.
    - Potom je rok uzavřený. Do schválení závěrky ho jde znovu otevřít: uzávěrkové zápisy i počáteční stavy dalšího roku se stornují (ZoÚ § 17 odst. 7).
  zdroje:
    - {typ: vyhlaska, odkaz: "vyhláška 504/2002, příloha 3, skupina 96"}
  platnost: {od: 2014-01-01}
  priklady: []

- id: otevreni-pocatecnimi-stavy
  nazev: Počáteční stavy převzaté z dřívějšího účetnictví
  kdy: 1. 1. prvního roku vedeného v aplikaci; konečné zůstatky předchozího roku jsou ze sestav dřívějšího správce.
  stav: navrh
  doklad: PS
  zpusob: kod
  postup:
    - Každý nenulový rozvahový zůstatek proti `pocatecni_rozvazny` (aktiva MD, pasiva D).
    - Pohledávky za vlastníky se rozepíšou po jednotkách (a u dřívějších vlastníků i jménem); součet rozpisu musí sedět na zůstatek účtu.
    - Součet aktiv a pasiv se musí rovnat, `pocatecni_rozvazny` po zápisu nemá zůstatek.
    - V roce jde jen jednou; oprava stornem.
  zdroje:
    - {typ: vyhlaska, odkaz: "vyhláška 504/2002, příloha 3, skupina 96"}
  platnost: {od: 2014-01-01}
  priklady: []

- id: dan-z-prijmu-predpis
  nazev: Předpis daně z příjmů za rok
  kdy: K 31. 12. roku, za který SVJ podává přiznání a vyjde mu daň (stránka Uzávěrka, Daň z příjmů).
  stav: overit
  doklad: ID
  vstupy: {polozka: položka správy, ze které daň zaplatí vlastníci, castka: daň za rok}
  zapisy:
    - md: naklady.dan_z_prijmu
      d: zavazky_dan_z_prijmu
      castka: "{castka}"
      dimenze: {sluzba: "{polozka}"}
  pravidla:
    - Daň se zaúčtuje do roku, za který se platí, ne až do roku zaplacení (kniha s. 82 a 91).
    - U zálohových příspěvků by daň udělala ztrátu. Náklad má proto položku správy, takže ho vyúčtování záloh na správu rozdělí na jednotky stejně jako ostatní náklady na správu; tím se zvýší příspěvky vlastníků (311/649) a uhradí z jejich záloh (324/311) a výsledek zůstane nulový (kniha s. 93–94).
    - Předpis daně proto patří před vyúčtování záloh na správu.
    - U nezálohových příspěvků daň jen sníží zisk; ty aplikace zatím nepodporuje.
  zdroje:
    - {typ: literatura, odkaz: "Durec, Účetnictví SVJ, 3. vyd., s. 82, 91 a 93–94"}
    - {typ: zakon, odkaz: "ZDP § 21 odst. 1"}
  platnost: {od: 2014-01-01}
  priklady:
    - nazev: Daň 2 520 Kč ze smluvní pokuty, rozúčtovaná se správou domu
      vstupy: {polozka: SPRAVA, castka: "2520.00"}
      ocekavane:
        - [md, naklady.dan_z_prijmu, "2520.00", {sluzba: SPRAVA}]
        - [d, zavazky_dan_z_prijmu, "2520.00", {sluzba: SPRAVA}]

- id: dan-z-prijmu-uhrada
  nazev: Zaplacení daně z příjmů
  kdy: SVJ zaplatí daň finančnímu úřadu, obvykle v roce po roce, za který se platí.
  stav: navrh
  doklad: BV
  vstupy: {ucet: bankovní účet SVJ, castka: zaplacená daň}
  zapisy:
    - md: zavazky_dan_z_prijmu
      d: "banka.{ucet}"
      castka: "{castka}"
  zdroje:
    - {typ: literatura, odkaz: "Durec, Účetnictví SVJ, 3. vyd., s. 91"}
  platnost: {od: 2014-01-01}
  priklady:
    - nazev: Platba daně z provozního účtu
      vstupy: {ucet: provozni, castka: "2520.00"}
      ocekavane:
        - [md, zavazky_dan_z_prijmu, "2520.00", {}]
        - [d, banka.provozni, "2520.00", {}]

- id: storno
  nazev: Storno zaúčtovaného zápisu
  kdy: Zjistí se chyba v zaúčtovaném zápisu otevřeného roku, nebo se doklad stane neprůkazným.
  stav: navrh
  doklad: ID
  zpusob: kod
  postup:
    - Kopie původního zápisu s prohozenými stranami a stejnými dimenzemi; `opravuje_zapis` ukazuje na původní.
    - Původní zápis se nemaže ani nemění. V uzavřeném roce storno nejde; oprava se účtuje v běžném roce.
    - Storno potřebuje důvod a podpisový záznam osoby odpovědné za zaúčtování (ZoÚ § 11 odst. 1 písm. f), § 12 odst. 2).
  zdroje:
    - {typ: zakon, odkaz: "ZoÚ § 33a odst. 2, § 35"}
  platnost: {od: 2014-01-01}
  priklady: []
