# Majetek, zásoby a hotovostní pokladna podle Durce (Účetnictví SVJ, 3. vyd., kap. 6.1 a 9).
# Formát viz README.md v této složce.

- id: pokladna-vyber
  nazev: Výběr hotovosti z účtu do pokladny
  kdy: Člen výboru vybere z účtu hotovost na drobné výdaje.
  stav: navrh
  doklad: PD
  vstupy: {ucet: bankovní účet SVJ, krok: "vyber | prijem", castka: vybraná částka}
  zapisy:
    - krok: vyber
      md: penize_na_ceste
      d: "banka.{ucet}"
      castka: "{castka}"
    - krok: prijem
      md: pokladna
      d: penize_na_ceste
      castka: "{castka}"
  pravidla:
    - Dva doklady: výpis z účtu (výběr) a příjmový pokladní doklad. Mezi nimi peníze leží na 261.
    - Pokladní kniha a podpisy dokladů jsou povinné; zůstatek pokladny se inventarizuje k 31. 12.
  zdroje:
    - {typ: literatura, odkaz: "Durec, Účetnictví SVJ, 3. vyd., s. 36 (pokladna 211) a s. 65 (peníze na cestě 261 u splátky úvěru)"}
  platnost: {od: 2014-01-01}
  priklady:
    - nazev: Výběr 3 000 Kč z provozního účtu
      krok: vyber
      vstupy: {ucet: provozni, castka: "3000.00"}
      ocekavane:
        - [md, penize_na_ceste, "3000.00", {}]
        - [d, banka.provozni, "3000.00", {}]
    - nazev: Příjem hotovosti do pokladny
      krok: prijem
      vstupy: {ucet: provozni, castka: "3000.00"}
      ocekavane:
        - [md, pokladna, "3000.00", {}]
        - [d, penize_na_ceste, "3000.00", {}]

- id: pokladna-vydaj
  nazev: Drobný výdaj z pokladny
  kdy: Nákup kancelářských potřeb, kolků a podobně v hotovosti.
  stav: navrh
  doklad: PD
  vstupy: {castka: částka výdaje, sluzba: "položka správy, ze které se výdaj platí (nepovinné)"}
  zapisy:
    - md: naklady.spotreba
      d: pokladna
      castka: "{castka}"
      dimenze: {sluzba: "{sluzba}"}
  pravidla:
    - Kolky a jiné poplatky patří na 538, ostatní drobný materiál na 501 (kniha s. 36).
    - Výdaj nesmí být vyšší než hotovost v pokladně ke dni výdaje.
  zdroje:
    - {typ: literatura, odkaz: "Durec, Účetnictví SVJ, 3. vyd., s. 36 (kap. 6.1)"}
  platnost: {od: 2014-01-01}
  priklady:
    - nazev: Kancelářské potřeby
      vstupy: {castka: "420.00", sluzba: ""}
      ocekavane:
        - [md, naklady.spotreba, "420.00", {}]
        - [d, pokladna, "420.00", {}]

- id: pokladna-platba-vlastnika
  nazev: Platba vlastníka v hotovosti
  kdy: Vlastník zaplatí zálohy nebo nedoplatek hotově do pokladny.
  stav: navrh
  doklad: PD
  vstupy: {jednotka: označení jednotky, castka: přijatá částka}
  zapisy:
    - md: pokladna
      d: pohledavky_vlastnici
      castka: "{castka}"
      dimenze: {jednotka: "{jednotka}"}
  zdroje:
    - {typ: literatura, odkaz: "Durec, Účetnictví SVJ, 3. vyd., s. 28 a 41 (221, 211/311)"}
  platnost: {od: 2014-01-01}
  priklady:
    - nazev: Hotovostní úhrada zálohy
      vstupy: {jednotka: "1001/5", castka: "4800.00"}
      ocekavane:
        - [md, pokladna, "4800.00", {}]
        - [d, pohledavky_vlastnici, "4800.00", {jednotka: "1001/5"}]

- id: majetek-porizeni
  nazev: Pořízení dlouhodobého majetku
  kdy: SVJ kupuje věc pro správu domu nad hranici dlouhodobého majetku ze svého vnitřního předpisu (nebo pozemek či jednotku, ty vždy).
  stav: navrh
  doklad: FP
  vstupy: {protistrana: dodavatel, castka: pořizovací cena včetně souvisejících nákladů, porizovani: "majetek_porizovani (hmotný) | majetek_nehmotny_porizovani (nehmotný)"}
  zapisy:
    - md: "{porizovani}"
      d: dodavatele
      castka: "{castka}"
      dimenze: {protistrana: "{protistrana}"}
  pravidla:
    - Majetek pod hranicí je drobný a účtuje se jako zásoby nebo rovnou do spotřeby.
    - Po dokončení se zařadí (majetek-zarazeni) a od dalšího měsíce účetně odpisuje.
  zdroje:
    - {typ: literatura, odkaz: "Durec, Účetnictví SVJ, 3. vyd., s. 69–71 (kap. 9.1)"}
    - {typ: vyhlaska, odkaz: "vyhláška 504/2002 Sb., § 7 odst. 1 a § 8 odst. 10 a 12"}
  platnost: {od: 2014-01-01}
  priklady:
    - nazev: Robotická sekačka na dvůr
      vstupy: {protistrana: prodejce, castka: "36000.00", porizovani: majetek_porizovani}
      ocekavane:
        - [md, majetek_porizovani, "36000.00", {protistrana: prodejce}]
        - [d, dodavatele, "36000.00", {protistrana: prodejce}]

- id: majetek-zarazeni
  nazev: Zařazení majetku do užívání a určení zdroje krytí
  kdy: Majetek je připravený k užívání.
  stav: navrh
  doklad: ID
  vstupy:
    majetek: "role majetku: majetek, majetek_stavby, majetek_pozemky, majetek_nehmotny"
    porizovani: "role pořizování: majetek_porizovani nebo majetek_nehmotny_porizovani"
    castka: pořizovací cena
    zdroj: "zalohy_dlouhodobe (fond oprav) | fond_ze_zisku; prázdné, když odpisy hradí provozní zálohy"
    kryti: "částka krytí přes vlastní jmění (pořizovací cena, nebo 0)"
  zapisy:
    - md: "{majetek}"
      d: "{porizovani}"
      castka: "{castka}"
    - md: "{zdroj}"
      d: zdroj_majetku
      castka: "{kryti}"
  pravidla:
    - Kniha uvádí dvě možnosti krytí; tady je ta rozvahová, kdy se pořízení uhradí přímo z fondu oprav (955) nebo u nezálohových příspěvků z fondu ze zisku (911) proti vlastnímu jmění (901).
    - Zdroj krytí se pak postupně vrací ve výši účetních odpisů (majetek-odpisy), aby odpisy fond podruhé nezatížily.
    - Když pořízení nekryje žádný fond, vlastníci ho zaplatí postupně přes odpisy, které jdou do vyúčtování položky správy (počítač pro výbor rovným dílem, sekačka podle podílů).
  zdroje:
    - {typ: literatura, odkaz: "Durec, Účetnictví SVJ, 3. vyd., s. 70–71 (kap. 9.1)"}
    - {typ: vyhlaska, odkaz: "vyhláška 504/2002 Sb., § 18 odst. 1 (vlastní jmění)"}
  platnost: {od: 2014-01-01}
  priklady:
    - nazev: Sekačka placená z fondu oprav
      vstupy: {majetek: majetek, porizovani: majetek_porizovani, castka: "38400.00", zdroj: zalohy_dlouhodobe, kryti: "38400.00"}
      ocekavane:
        - [md, majetek, "38400.00", {}]
        - [d, majetek_porizovani, "38400.00", {}]
        - [md, zalohy_dlouhodobe, "38400.00", {}]
        - [d, zdroj_majetku, "38400.00", {}]
    - nazev: Software odepisovaný přes provozní zálohy
      vstupy: {majetek: majetek_nehmotny, porizovani: majetek_nehmotny_porizovani, castka: "90000.00", zdroj: "", kryti: "0"}
      ocekavane:
        - [md, majetek_nehmotny, "90000.00", {}]
        - [d, majetek_nehmotny_porizovani, "90000.00", {}]

- id: majetek-odpisy
  nazev: Roční účetní odpis majetku a vrácení zdroje krytí
  kdy: Nejpozději k rozvahovému dni (ČUS 409 odst. 4.3).
  stav: navrh
  doklad: ID
  vstupy:
    opravky: "role oprávek: opravky_majetku, opravky_staveb, opravky_nehmotneho"
    castka: odpis za rok
    sluzba: "položka správy, když odpisy hradí provozní zálohy; jinak prázdné"
    zdroj: "zalohy_dlouhodobe | fond_ze_zisku | prázdné"
    vraceni: "vrácení zdroje krytí (odpis, nebo 0)"
    kryti: "úhrada odpisu z fondu oprav (odpis u fondu oprav, jinak 0)"
  zapisy:
    - md: naklady.odpisy
      d: "{opravky}"
      castka: "{castka}"
      dimenze: {sluzba: "{sluzba}"}
    - md: zdroj_majetku
      d: "{zdroj}"
      castka: "{vraceni}"
    - md: "{zdroj}"
      d: vynosy.zuctovani_dlouhodobych_zaloh
      castka: "{kryti}"
  pravidla:
    - Odepisuje se rovnoměrně po měsících od měsíce po zařazení, po celých korunách tak, aby součet odpisů přesně dal pořizovací cenu.
    - Odpisy jsou náklad na správu, ale vlastníci majetek zaplatili už při pořízení; proto se ve stejné výši vrací zdroj krytí z 901 do fondu.
    - U fondu oprav se odpis zároveň uhradí z fondu (955/649) jako každý jiný náklad, který fond kryje; fond oprav se tak kvůli majetku sníží jen jednou, při zařazení. Výsledek hospodaření je nulový.
    - U fondu ze zisku (nezálohové příspěvky) je odpis ztrátou roku a vrácení 901/911 fond doplní (Durec s. 71).
    - Po úplném odepsání je 901 nulový.
  zdroje:
    - {typ: literatura, odkaz: "Durec, Účetnictví SVJ, 3. vyd., s. 70–71 (kap. 9.1)"}
    - {typ: zakon, odkaz: "zákon 563/1991 Sb., § 28 odst. 1 a 6"}
  platnost: {od: 2014-01-01}
  priklady:
    - nazev: Odpis sekačky za červenec až prosinec, fond oprav
      vstupy: {opravky: opravky_majetku, castka: "3200.00", sluzba: "", zdroj: zalohy_dlouhodobe, vraceni: "3200.00", kryti: "3200.00"}
      ocekavane:
        - [md, naklady.odpisy, "3200.00", {}]
        - [d, opravky_majetku, "3200.00", {}]
        - [md, zdroj_majetku, "3200.00", {}]
        - [d, zalohy_dlouhodobe, "3200.00", {}]
        - [md, zalohy_dlouhodobe, "3200.00", {}]
        - [d, vynosy.zuctovani_dlouhodobych_zaloh, "3200.00", {}]
    - nazev: Odpis softwaru, který platí správa domu
      vstupy: {opravky: opravky_nehmotneho, castka: "30000.00", sluzba: SPRAVA, zdroj: "", vraceni: "0", kryti: "0"}
      ocekavane:
        - [md, naklady.odpisy, "30000.00", {sluzba: SPRAVA}]
        - [d, opravky_nehmotneho, "30000.00", {}]

- id: majetek-vyrazeni
  nazev: Vyřazení majetku
  kdy: Majetek se prodá, zničí nebo přestane používat.
  stav: navrh
  doklad: ID
  vstupy:
    majetek: role majetku
    opravky: role oprávek
    cena: pořizovací cena
    zbyva: "zůstatková cena, která se doodepíše (0 u plně odepsaného)"
    sluzba: "položka správy, když odpisy hradí provozní zálohy; jinak prázdné"
    zdroj: "zalohy_dlouhodobe | fond_ze_zisku | prázdné"
    vraceni: "vrácení zdroje krytí ve výši zůstatkové ceny, nebo 0"
    kryti: "úhrada doodepsání z fondu oprav, nebo 0"
  zapisy:
    - md: naklady.odpisy
      d: "{opravky}"
      castka: "{zbyva}"
      dimenze: {sluzba: "{sluzba}"}
    - md: zdroj_majetku
      d: "{zdroj}"
      castka: "{vraceni}"
    - md: "{zdroj}"
      d: vynosy.zuctovani_dlouhodobych_zaloh
      castka: "{kryti}"
    - md: "{opravky}"
      d: "{majetek}"
      castka: "{cena}"
  pravidla:
    - Vyřazuje-li se majetek dřív, než je odepsaný, nejdřív se doodepíše zůstatková cena; plně odepsaný majetek se jen odúčtuje proti oprávkám.
    - Příjem z prodeje majetku je samostatný výnos (641 nebo 648 podle účetní) a do tohoto zápisu nepatří.
  zdroje:
    - {typ: literatura, odkaz: "Durec, Účetnictví SVJ, 3. vyd., s. 71 (kap. 9.1)"}
  platnost: {od: 2014-01-01}
  priklady:
    - nazev: Rozbitá sekačka vyřazená po dvou letech
      vstupy: {majetek: majetek, opravky: opravky_majetku, cena: "38400.00", zbyva: "25600.00", sluzba: "", zdroj: zalohy_dlouhodobe, vraceni: "25600.00", kryti: "25600.00"}
      ocekavane:
        - [md, naklady.odpisy, "25600.00", {}]
        - [d, opravky_majetku, "25600.00", {}]
        - [md, zdroj_majetku, "25600.00", {}]
        - [d, zalohy_dlouhodobe, "25600.00", {}]
        - [md, zalohy_dlouhodobe, "25600.00", {}]
        - [d, vynosy.zuctovani_dlouhodobych_zaloh, "25600.00", {}]
        - [md, opravky_majetku, "38400.00", {}]
        - [d, majetek, "38400.00", {}]

- id: zasoby-konec-roku
  nazev: Nespotřebované zásoby na konci roku (způsob B)
  kdy: K 31. 12. podle inventury, když SVJ účtuje zásoby rovnou do spotřeby a na konci roku je převede na sklad.
  stav: navrh
  doklad: ID
  vstupy: {castka: "hodnota zásob podle inventury; v novém roce stejná částka záporně"}
  zapisy:
    - md: zasoby
      d: naklady.spotreba
      castka: "{castka}"
  pravidla:
    - Na začátku dalšího roku se zápis obrátí (záporná částka): zásoby jdou zpět do spotřeby.
  zdroje:
    - {typ: literatura, odkaz: "Durec, Účetnictví SVJ, 3. vyd., s. 72 (kap. 9.2)"}
    - {typ: vyhlaska, odkaz: "ČUS 410 (způsob A a B)"}
  platnost: {od: 2014-01-01}
  priklady:
    - nazev: Toner nespotřebovaný k 31. 12.
      vstupy: {castka: "450.00"}
      ocekavane:
        - [md, zasoby, "450.00", {}]
        - [d, naklady.spotreba, "450.00", {}]
    - nazev: Zpět do spotřeby v dalším roce
      vstupy: {castka: "-450.00"}
      ocekavane:
        - [md, naklady.spotreba, "450.00", {}]
        - [d, zasoby, "450.00", {}]
