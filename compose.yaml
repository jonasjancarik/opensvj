# Vývojová databáze. Aplikace používá schéma public, Better Auth schéma auth.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: svj
      POSTGRES_USER: svj
      POSTGRES_PASSWORD: svj
    ports:
      - "5440:5432"
    volumes:
      - db:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svj -d svj"]
      interval: 2s
      retries: 20
volumes:
  db:
